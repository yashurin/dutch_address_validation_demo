[project]
name = "address-validation"
version = "0.1.0"
description = "In-memory Dutch address validation from the PCS postcode files"
requires-python = ">=3.13"
license = "LicenseRef-proprietary"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "black>=24", "ruff>=0.8"]

[project.scripts]
address-validation-api = "address_validation.api:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["address_validation", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["address_validation"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["address_validation*"]

[tool.setuptools.package-data]
address_validation = ["py.typed"]
